<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KONJACLATE — Interpretation Practice Studio</title>

  <!-- Google Fonts: Nunito (Display/Headings), Plus Jakarta Sans & Be Vietnam Pro (Body & Vietnamese Translations) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Be Vietnam Pro', 'system-ui', 'sans-serif'],
            display: ['Nunito', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            mintbg: '#F6FDF2',
            leaf: '#58CC02',
            leafDark: '#46A302',
            leafHover: '#61E002',
            duoTint: '#D7FFB8',
            duoSoft: '#EEFFDB',
            duoOrange: '#FF9600',
            practice: '#2B75FF',
            challenge: '#FF2B2B',
          },
          boxShadow: {
            card: '0 6px 20px -4px rgba(88, 204, 2, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
            cardHover: '0 16px 32px -6px rgba(88, 204, 2, 0.18), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
            glowBlue: '0 8px 22px -4px rgba(43, 117, 255, 0.35)',
            glowRed: '0 8px 22px -4px rgba(255, 43, 43, 0.35)',
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --accent: #2B75FF;
    }

    body {
      background-color: #F6FDF2;
      background-image: radial-gradient(#DDF2D0 1.35px, transparent 1.35px);
      background-size: 24px 24px;
      color: #132A1C;
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Nunito', 'Plus Jakarta Sans', sans-serif;
    }

    /* Duolingo 3D Tactile Buttons */
    .btn-3d-green {
      background-color: #58CC02;
      color: #FFFFFF;
      border-bottom: 4px solid #46A302;
      transition: transform 0.12s ease, background-color 0.15s ease, border-bottom-width 0.12s ease;
    }
    .btn-3d-green:hover { background-color: #61E002; }
    .btn-3d-green:active { transform: translateY(2px); border-bottom-width: 2px; border-bottom-color: #58A700; }

    .btn-3d-blue {
      background-color: #2B75FF;
      color: #FFFFFF;
      border-bottom: 4px solid #1D4ED8;
      transition: transform 0.12s ease, filter 0.15s ease, border-bottom-width 0.12s ease;
    }
    .btn-3d-blue:hover { filter: brightness(1.05); }
    .btn-3d-blue:active { transform: translateY(2px); border-bottom-width: 2px; }

    .btn-3d-red {
      background-color: #FF2B2B;
      color: #FFFFFF;
      border-bottom: 4px solid #B91C1C;
      transition: transform 0.12s ease, filter 0.15s ease, border-bottom-width 0.12s ease;
    }
    .btn-3d-red:hover { filter: brightness(1.05); }
    .btn-3d-red:active { transform: translateY(2px); border-bottom-width: 2px; }

    .btn-3d-white {
      background-color: #FFFFFF;
      color: #1E293B;
      border: 2px solid #E5E7EB;
      border-bottom: 4px solid #D1D5DB;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-3d-white:hover { background-color: #F6FDF2; border-color: #D7FFB8; border-bottom-color: #58CC02; }
    .btn-3d-white:active { transform: translateY(2px); border-bottom-width: 2px; }

    /* Tactile 3D Cards */
    .duo-card {
      border: 2px solid #E5E7EB;
      border-bottom: 4px solid #D1D5DB;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .duo-card:hover {
      border-color: #58CC02;
      border-bottom-color: #46A302;
    }
    .duo-card.challenge-card:hover {
      border-color: #FF2B2B;
      border-bottom-color: #B91C1C;
    }

    /* Mode Switcher Gradient Animation */
    .mode-track {
      background: linear-gradient(135deg, #2B75FF 0%, #5CA8FF 45%, #FF525A 55%, #FF2B2B 100%);
      background-size: 240% 240%;
      background-position: 0% 50%;
      transition: background-position 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    }
    .mode-track.is-challenge { background-position: 100% 50%; }
    .mode-knob { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .mode-track.is-challenge .mode-knob { transform: translateX(36px); }

    /* Hero Banner */
    .hero-green {
      background: linear-gradient(135deg, #58CC02 0%, #46A302 100%);
      transition: background 0.5s ease;
    }
    .hero-green.is-challenge {
      background: linear-gradient(135deg, #DC2626 0%, #EF4444 55%, #B91C1C 100%);
    }

    /* Mascot Float */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .mascot-float { animation: floatSlow 3.2s ease-in-out infinite; }

    /* Flame Flicker */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 6px rgba(255, 150, 0, 0.55)); }
      50% { transform: scale(1.14) rotate(3deg); filter: drop-shadow(0 0 12px rgba(255, 90, 0, 0.85)); }
    }
    .flame-anim { display: inline-block; animation: flameFlicker 1.5s ease-in-out infinite; }

    /* Audio Waveform */
    @keyframes waveBounce {
      0%, 100% { height: 18%; }
      50% { height: 92%; }
    }
    .wave-bar { height: 22%; transition: height 0.2s ease; }
    .wave-active .wave-bar { animation: waveBounce 0.85s ease-in-out infinite; }
    .wave-active .wave-bar:nth-child(2n) { animation-duration: 0.65s; animation-delay: 0.1s; }
    .wave-active .wave-bar:nth-child(3n) { animation-duration: 1.05s; animation-delay: 0.22s; }
    .wave-active .wave-bar:nth-child(5n) { animation-duration: 0.75s; animation-delay: 0.35s; }

    /* Recording Pulse */
    @keyframes recPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 43, 43, 0.55); }
      70% { box-shadow: 0 0 0 18px rgba(255, 43, 43, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 43, 43, 0); }
    }
    .rec-pulse { animation: recPulse 1.4s infinite; }

    /* Confetti */
    @keyframes confettiFall {
      0% { transform: translateY(-16px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(150px) rotate(540deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      animation: confettiFall 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* Smooth View Entrance */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view { animation: fadeSlideUp 0.28s ease-out forwards; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #EEFFDB; }
    ::-webkit-scrollbar-thumb { background: #89E219; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #58CC02; }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#D7FFB8] selection:text-[#2D6A00]">

  <!-- ==================== SPLASH / LOADING SCREEN ==================== -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#F6FDF2] px-6 transition-opacity duration-500" style="background-image: radial-gradient(#DDF2D0 1.35px, transparent 1.35px); background-size: 24px 24px;">
    <div class="relative flex flex-col items-center max-w-lg text-center bg-white/95 backdrop-blur-md p-8 sm:p-10 rounded-[32px] border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card">
      <div id="splash-mascot" class="mascot-float mb-4"></div>

      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#EEFFDB] border border-[#D7FFB8] text-[#46A302] text-xs font-extrabold tracking-wider uppercase mb-2">
        Interpretation Practice Studio
      </div>
      <h1 class="font-display text-4xl sm:text-5xl font-black tracking-tight text-slate-900 mb-3">
        KONJAC<span class="text-[#58CC02]">LATE</span>

      <div class="w-full max-w-xs">

          <span>Preparing interpreting studio...</span>

        <div class="w-full h-3.5 bg-[#EEFFDB] rounded-full overflow-hidden p-0.5 border border-[#D7FFB8]">
          <div id="splash-bar" class="h-full rounded-full bg-gradient-to-r from-[#58CC02] to-[#89E219] transition-all duration-100" style="width: 0%"></div>
        </div>
      </div>

      <button onclick="dismissSplash()" class="mt-6 btn-3d-white px-5 py-2 rounded-2xl text-sm font-bold inline-flex items-center gap-1.5">
        Enter Studio
        <svg class="w-4 h-4 text-[#58CC02]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
      </button>
    </div>
  </div>

        <button id="nav-admin-btn" onclick="toggleAdminView()" class="sm:hidden inline-flex items-center gap-1 px-3 py-2 rounded-2xl text-xs font-bold btn-3d-white">
          <span id="nav-admin-label">Admin</span>
        </button>
      </div>
    </div>
  </header>

      if (!input) return '';

      const matchFile = trimmed.match(/\/d\/([a-zA-Z0-9_-]{10,})/);

      const matchParam = trimmed.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
      if (matchParam) return matchParam[1];
      if (/^[a-zA-Z0-9_-]{15,}$/.test(trimmed)) return trimmed;

    function cleanupMedia() {
      if (activeAudioEl) {
        try {
          activeAudioEl.pause();
          activeAudioEl.ontimeupdate = null;
          activeAudioEl.onended = null;
          activeAudioEl.onerror = null;
          activeAudioEl.onloadedmetadata = null;
        } catch (e) {}
        activeAudioEl = null;
      }
      if (activeCountdownTimer) { clearInterval(activeCountdownTimer); activeCountdownTimer = null; }
      if (activeRecInterval) { clearInterval(activeRecInterval); activeRecInterval = null; }
      if (activeSimPlaybackInterval) { clearInterval(activeSimPlaybackInterval); activeSimPlaybackInterval = null; }
      if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
        try { activeMediaRecorder.stop(); } catch (e) {}
      }
      activeMediaRecorder = null;
      if (activeMediaStream) {
        try { activeMediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
        activeMediaStream = null;
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * Groups sentences into 2-3 (Practice) or 3-4 (Challenge) per turn
     * and computes proportional start/end time ratios based on word counts.
     */
    function buildSegments(sentences, mode) {
      const list = Array.isArray(sentences) ? sentences : [];
      if (list.length === 0) return [];
      const groups = [];
      if (mode === 'CHALLENGE') {
        if (list.length <= 4) {
          groups.push(list);
        } else {
          let i = 0;
          while (i < list.length) {
            const rem = list.length - i;
            if (rem <= 4) { groups.push(list.slice(i)); break; }
            else if (rem === 5) { groups.push(list.slice(i, i + 3)); groups.push(list.slice(i + 3)); break; }
            else { groups.push(list.slice(i, i + 3)); i += 3; }
          }
        }
      } else {
        if (list.length <= 3) {
          groups.push(list);
        } else {
          let i = 0;
          while (i < list.length) {
            const rem = list.length - i;
            if (rem <= 3) { groups.push(list.slice(i)); break; }
            else { groups.push(list.slice(i, i + 2)); i += 2; }
          }
        }
      }

      const wordCounts = groups.map(grp =>
        grp.reduce((sum, s) => sum + stripChunks(s).split(/\s+/).filter(Boolean).length, 0)
      );
      const totalWords = Math.max(1, wordCounts.reduce((a, b) => a + b, 0));

      let acc = 0;
      return groups.map((grp, idx) => {
        const startRatio = acc / totalWords;
        acc += wordCounts[idx];
        const endRatio = acc / totalWords;
        return { sentences: grp, startRatio, endRatio };
      });
    }

      const pos = activeEl ? activeEl.selectionStart : 0;

    /*************************************************************************
     * 9. VIEW 4: INTERPRETING WORKSPACE ([INTERPRET] — ORIGINAL MP3 ENGINE)
     *************************************************************************/
    function renderInterpretView() {
      const ex = getSelectedExercise();
      if (!ex) return renderHomeView();

      const isChallenge = state.mode === 'CHALLENGE';
      const accent = isChallenge ? '#FF2B2B' : '#58CC02';
      const lv = getLevelStyle(ex.level, state.mode);
      const {
        segments, currentIndex, phase, countdownVal, recSeconds,
        showHelper, showChunking, micSimulated, playbackProgress,
        audioError, showEmbedPlayer, localAudioName
      } = state.interpret;

      const totalSegs = segments.length;
      const currentSeg = segments[currentIndex] || { sentences: [] };
      const progressPct = Math.round((currentIndex / Math.max(1, totalSegs)) * 100);
      const activeSpeed = isChallenge ? 1.0 : state.params.speed;
      const sourceLabel = localAudioName
        ? `Local MP3 (${localAudioName})`
        : 'Original Audio (MP3)';

      let stageHtml = '';
      if (phase === 'IDLE') {
        stageHtml = `
          <div class="flex flex-col items-center text-center py-6">
            <p class="text-sm font-semibold text-slate-500 mb-6">

            <span class="mt-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">PLAY AUDIO</span>
          </div>

      } else if (phase === 'PLAYING') {
        stageHtml = `
          <div class="flex flex-col items-center text-center py-6">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-extrabold mb-6" style="background:${isChallenge ? '#FEF2F2' : '#EEFFDB'}; color:${isChallenge ? '#DC2626' : '#46A302'};">

              Playing Segment ${currentIndex + 1}/${totalSegs}... Listen carefully & take mental notes!
            </div>

            <div class="wave-active flex items-center justify-center gap-1.5 h-24 w-full max-w-md mb-6 px-4">
              ${Array.from({ length: 24 }).map(() => `<div class="wave-bar w-2 rounded-full" style="background:${accent}"></div>`).join('')}
            </div>

            <button onclick="skipToCountdown()" class="text-xs font-bold text-slate-400 hover:text-slate-700 underline underline-offset-4">

          </div>

            <div class="rec-pulse w-24 h-24 rounded-full bg-[#FF2B2B] text-white flex items-center justify-center mb-4">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
              </svg>
            </div>

            <div id="rec-timer-text" class="font-display text-2xl font-black text-slate-900 mb-2">${timeStr}</div>
            ${micSimulated
              ? `<p class="text-xs text-amber-700 bg-amber-50 px-3 py-1 rounded-full mb-4 font-semibold">Simulated timer mode (Microphone permission unavailable)</p>`
              : `<p class="text-xs text-slate-400 mb-5">Speak your Vietnamese interpretation naturally</p>`}

            <button onclick="stopRecording()" class="px-8 py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border-b-4 border-slate-700 text-white font-extrabold text-sm shadow-lg transition-all flex items-center gap-2">
              <span class="w-3 h-3 rounded-sm bg-red-500"></span>
              Stop Recording
            </button>
          </div>
        `;
      } else if (phase === 'PLAYBACK') {
        const isLast = currentIndex >= totalSegs - 1;
        stageHtml = `
          <div class="flex flex-col items-center text-center py-6">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#EEFFDB] text-[#46A302] text-xs font-extrabold mb-5">
              <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
              Playing back your recording for self-monitoring...
            </div>

            <div class="w-full max-w-md bg-[#F6FDF2] border-2 border-[#D7FFB8] rounded-2xl p-4 mb-6">
              <div class="flex justify-between text-xs font-bold text-slate-500 mb-2">
                <span>Your Recording — Segment ${currentIndex + 1}</span>
                <span id="playback-pct-label">${Math.round(playbackProgress)}%</span>
              </div>
              <div class="w-full h-2.5 bg-[#EEFFDB] rounded-full overflow-hidden">
                <div id="playback-bar-fill" class="h-full rounded-full bg-[#58CC02] transition-all duration-150" style="width:${playbackProgress}%"></div>
              </div>
            </div>

            <button onclick="proceedNextSegment()" class="${isChallenge ? 'btn-3d-red' : 'btn-3d-green'} px-7 py-3 rounded-2xl font-extrabold text-sm">
              ${isLast ? 'Finish & View Review →' : 'Next Segment →'}
            </button>
          </div>
        `;
      }

      return `
        <div class="animate-view max-w-4xl mx-auto space-y-6">
          <!-- Top Bar -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <button onclick="confirmExitInterpret()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-900">
              ✕ Exit Session
            </button>

            <div class="flex flex-wrap items-center gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-extrabold" style="background:${lv.bg}; color:${lv.text};">${lv.label}</span>
              <span class="px-3 py-1 rounded-full text-xs font-extrabold ${isChallenge ? 'bg-red-50 text-[#FF2B2B]' : 'bg-blue-50 text-[#2B75FF]'}">${state.mode}</span>
              <button onclick="toggleChunkingHint()" class="px-3.5 py-1.5 rounded-full text-xs font-extrabold border-2 transition-colors ${showChunking ? 'bg-[#58CC02] text-white border-[#46A302]' : 'bg-white text-[#46A302] border-[#D7FFB8] hover:bg-[#EEFFDB]'}">
                ${showChunking ? 'Hide Chunking Guide (/)' : '✂️ Chunking Guide (/)'}
              </button>
              ${!isChallenge ? `
                <button onclick="toggleInterpretHelper()" class="px-3.5 py-1.5 rounded-full text-xs font-extrabold border-2 transition-colors ${showHelper ? 'bg-[#2B75FF] text-white border-[#2B75FF]' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">
                  ${showHelper ? 'Hide Glossary' : '📖 Glossary'}
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Progress Card -->
          <div class="bg-white rounded-[26px] p-5 sm:p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
              <h1 class="font-display text-lg sm:text-xl font-black text-slate-900">${escapeHtml(ex.title)}</h1>
              <span class="text-sm font-black" style="color:${accent}">Segment ${currentIndex + 1} / ${totalSegs}</span>
            </div>
            <div class="w-full h-3 bg-[#EEFFDB] rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500" style="width:${Math.max(10, progressPct)}%; background:${accent}"></div>
            </div>
          </div>

          <!-- SEAMLESS AUDIO FALLBACK BANNER (IF GOOGLE DRIVE STREAMING IS BLOCKED) -->
          ${audioError ? `
            <div class="bg-amber-50 border-2 border-amber-200 rounded-[24px] p-4 sm:p-5 flex flex-col gap-3 animate-view">
              <div class="flex items-start gap-3">
                <span class="text-xl leading-none">⚠️</span>
                <div class="text-xs sm:text-sm text-amber-900 leading-relaxed">
                  <strong>Direct Google Drive streaming was blocked by your browser or iframe policy.</strong> Use the Embedded Drive Player below or load a local MP3 file from your device:
                </div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                ${ex.driveFileId ? `
                  <button onclick="toggleEmbedDrivePlayer()" class="btn-3d-white px-4 py-2 rounded-xl text-xs font-extrabold">
                    ${showEmbedPlayer ? 'Hide Embedded Drive Player' : '▶️ Open Embedded Drive Player'}
                  </button>
                ` : ''}
                <label class="cursor-pointer btn-3d-white px-4 py-2 rounded-xl text-xs font-extrabold inline-flex items-center gap-1.5">
                  📂 Load Local MP3 File
                  <input type="file" accept="audio/*" onchange="handleLocalAudioUpload(event)" class="hidden" />
                </label>
              </div>
            </div>
          ` : ''}

          <!-- COLLAPSIBLE EMBEDDED GOOGLE DRIVE PLAYER -->
          ${(showEmbedPlayer && ex.driveFileId) ? `
            <div class="bg-white rounded-[24px] p-4 border-2 border-[#E5E7EB] shadow-card animate-view space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-slate-700">🎧 Embedded Google Drive Audio Player</span>
                <button onclick="toggleEmbedDrivePlayer()" class="text-xs font-bold text-slate-400 hover:text-slate-700">Close</button>
              </div>
              <iframe src="https://drive.google.com/file/d/${escapeHtml(ex.driveFileId)}/preview" class="w-full h-24 rounded-xl border border-slate-200" allow="autoplay"></iframe>
            </div>
          ` : ''}

          <!-- MAIN INTERPRETATION STAGE -->
          <div class="bg-white rounded-[30px] p-6 sm:p-10 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card">
            <!-- 4-Step Loop Tracker -->
            <div class="grid grid-cols-4 gap-2 mb-8 text-center">
              ${[
                { id: 'PLAYING', label: '1. Listen' },
                { id: 'COUNTDOWN', label: '2. Countdown (2s)' },
                { id: 'RECORDING', label: '3. Record' },
                { id: 'PLAYBACK', label: '4. Playback' }
              ].map((step, i) => {
                const order = { IDLE: -1, PLAYING: 0, COUNTDOWN: 1, RECORDING: 2, PLAYBACK: 3 };
                const cur = order[phase] ?? -1;
                const active = cur === i;
                const done = cur > i;
                return `
                  <div class="py-2 px-2 rounded-xl text-[11px] sm:text-xs font-extrabold transition-all ${active ? 'text-white shadow-sm' : done ? 'bg-[#EEFFDB] text-[#46A302]' : 'bg-slate-50 text-slate-400'}" style="${active ? `background:${accent}` : ''}">
                    ${done ? '✓ ' : ''}${step.label}
                  </div>
                `;
              }).join('')}
            </div>

            ${stageHtml}

            <!-- Utility Bar for Audio Options -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
              <span>Audio: <strong class="text-slate-700">${escapeHtml(sourceLabel)}</strong></span>
              <div class="flex flex-wrap items-center gap-3">
                ${ex.driveFileId ? `
                  <button onclick="toggleEmbedDrivePlayer()" class="font-bold text-slate-500 hover:text-slate-800 hover:underline">
                    ${showEmbedPlayer ? 'Hide Drive Embed' : 'Drive Embed Player'}
                  </button>
                ` : ''}
                <label class="cursor-pointer font-bold text-slate-500 hover:text-slate-800 hover:underline">
                  Load Local MP3
                  <input type="file" accept="audio/*" onchange="handleLocalAudioUpload(event)" class="hidden" />
                </label>
              </div>
            </div>
          </div>

          <!-- CHUNKING (/) HINTS PANEL -->
          ${showChunking ? `
            <div class="bg-white rounded-[26px] p-6 border-2 border-[#D7FFB8] shadow-card animate-view space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="font-display font-extrabold text-[#46A302] text-base">✂️ Chunking Guide (/) — Segment ${currentIndex + 1}</h3>
                <button onclick="toggleChunkingHint()" class="text-xs font-bold text-slate-400 hover:text-slate-700">Close</button>
              </div>
              <div class="space-y-2.5 text-sm text-slate-800 leading-relaxed bg-[#F6FDF2] p-4 rounded-2xl border border-[#D7FFB8]">
                ${currentSeg.sentences.map(s => `<p>${escapeHtml(s).replace(/\s\/\s/g, ' <span class="text-[#58CC02] font-black px-1">/</span> ')}</p>`).join('')}
              </div>
            </div>
          ` : ''}

          <!-- GLOSSARY QUICK DRAWER (PRACTICE MODE ONLY) -->
          ${(!isChallenge && showHelper) ? `
            <div class="bg-white rounded-[26px] p-6 border-2 border-blue-200 shadow-card animate-view space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-display font-extrabold text-slate-900 text-base">📖 Quick Glossary (${ex.glossary.length} words)</h3>
                <button onclick="toggleInterpretHelper()" class="text-xs font-bold text-slate-400 hover:text-slate-700">Close</button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-56 overflow-y-auto pr-1">
                ${ex.glossary.map(g => `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                    <span class="font-extrabold text-slate-900">${escapeHtml(g.term)}</span>
                    <span class="text-[#58CC02] mx-1">→</span>
                    <span class="text-slate-600">${escapeHtml(g.meaning)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleInterpretHelper() { state.interpret.showHelper = !state.interpret.showHelper; render(); }
    function toggleChunkingHint() { state.interpret.showChunking = !state.interpret.showChunking; render(); }
    function toggleEmbedDrivePlayer() { state.interpret.showEmbedPlayer = !state.interpret.showEmbedPlayer; render(); }

    function handleLocalAudioUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      cleanupMedia();
      state.interpret.localAudioUrl = URL.createObjectURL(file);
      state.interpret.localAudioName = file.name;
      state.interpret.audioError = false;
      state.interpret.phase = 'IDLE';
      showToast(`Loaded local audio: ${file.name}`, 'success');
      render();
    }

    function confirmExitInterpret() {
      openModal({
        title: 'Exit Interpreting Session?',
        body: 'Your progress for this session will not count toward your streak unless you complete all segments and reach the Review screen.',
        actions: [
          { label: 'Keep Practicing', className: 'btn-3d-white px-4 py-2 rounded-2xl text-sm font-bold' },
          { label: 'Exit to Hub', className: 'btn-3d-red px-4 py-2 rounded-2xl text-sm font-extrabold', onClick: () => navigate('home') }
        ]
      });
    }

    function formatDuration(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ---- [INTERPRET] STEP 1: ORIGINAL GOOGLE DRIVE MP3 + PROPORTIONAL SEGMENT PAUSING ----
    function startSegmentPlayback() {
      cleanupMedia();
      const ex = getSelectedExercise();
      if (!ex) return;

      const seg = state.interpret.segments[state.interpret.currentIndex];
      if (!seg) return;

      const speed = state.mode === 'CHALLENGE' ? 1.0 : state.params.speed;

      state.interpret.phase = 'PLAYING';
      render();

      // Priority 1: Local MP3 file loaded by user
      if (state.interpret.localAudioUrl) {
        playSegmentedAudioUrl(state.interpret.localAudioUrl, null, seg, speed);
        return;
      }

      // Priority 2: Original Google Drive MP3
      if (ex.driveFileId && ex.driveFileId.trim()) {
        const primaryUrl = `https://docs.google.com/uc?export=open&id=${ex.driveFileId.trim()}`;
        const fallbackUrl = `https://docs.google.com/uc?export=download&id=${ex.driveFileId.trim()}`;
        playSegmentedAudioUrl(primaryUrl, fallbackUrl, seg, speed);
        return;
      }

      // No audio linked
      state.interpret.phase = 'IDLE';
      state.interpret.audioError = true;
      showToast('No audio file linked to this exercise — please load a local MP3 file.', 'warning');
      render();
    }

    function playSegmentedAudioUrl(primaryUrl, fallbackUrl, seg, speed) {
      let triedFallback = false;

      function tryLoad(url) {
        try {
          const audio = new Audio(url);
          audio.preload = 'metadata';
          activeAudioEl = audio;

          let segmentStarted = false;
          let endTime = Infinity;

          audio.onloadedmetadata = () => {
            if (activeAudioEl !== audio) return;
            const dur = audio.duration;
            if (dur && isFinite(dur) && dur > 0) {
              const startTime = Math.max(0, seg.startRatio * dur);
              endTime = Math.min(dur, seg.endRatio * dur);
              try { audio.currentTime = startTime; } catch (e) {}
            }
            audio.playbackRate = speed;
            audio.play().then(() => {
              segmentStarted = true;
              state.interpret.audioError = false;
            }).catch(() => handleFail());
          };

          audio.ontimeupdate = () => {
            if (activeAudioEl !== audio || !segmentStarted) return;
            if (audio.currentTime >= endTime - 0.08) {
              audio.pause();
              audio.ontimeupdate = null;
              if (state.view === 'interpret' && state.interpret.phase === 'PLAYING') {
                startCountdown();
              }
            }
          };

          audio.onended = () => {
            if (activeAudioEl !== audio) return;
            if (state.view === 'interpret' && state.interpret.phase === 'PLAYING') {
              startCountdown();
            }
          };

          audio.onerror = () => handleFail();

          // Safety timeout if Drive hangs silently without firing onerror
          setTimeout(() => {
            if (activeAudioEl === audio && !segmentStarted && state.view === 'interpret' && state.interpret.phase === 'PLAYING') {
              handleFail();
            }
          }, 5500);
        } catch (e) {
          handleFail();
        }
      }

      function handleFail() {
        if (!triedFallback && fallbackUrl) {
          triedFallback = true;
          tryLoad(fallbackUrl);
          return;
        }
        cleanupMedia();
        state.interpret.audioError = true;
        state.interpret.showEmbedPlayer = true;
        state.interpret.phase = 'IDLE';
        showToast('Direct Drive MP3 blocked by browser — use the Embedded Drive Player below or load a local MP3 file.', 'warning');
        render();
      }

      tryLoad(primaryUrl);
    }

    function skipToCountdown() { cleanupMedia(); startCountdown(); }

    // ---- [INTERPRET] STEP 2: 2-SECOND COUNTDOWN ----
    function startCountdown() {
      cleanupMedia();
      state.interpret.phase = 'COUNTDOWN';
      state.interpret.countdownVal = 2;
      render();

      activeCountdownTimer = setInterval(() => {
        state.interpret.countdownVal -= 1;
        if (state.interpret.countdownVal <= 0) {
          clearInterval(activeCountdownTimer);
          activeCountdownTimer = null;
          startRecording();
        } else {
          const el = document.getElementById('countdown-number');
          if (el) el.textContent = state.interpret.countdownVal;
        }
      }, 1000);
    }

    // ---- [INTERPRET] STEP 3: MICROPHONE RECORDING ----
    async function startRecording() {
      cleanupMedia();
      state.interpret.phase = 'RECORDING';
      state.interpret.recSeconds = 0;
      state.interpret.micSimulated = false;
      activeRecordedChunks = [];

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined') {
        try {
          activeMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          activeMediaRecorder = new MediaRecorder(activeMediaStream);
          activeMediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) activeRecordedChunks.push(e.data);
          };
          activeMediaRecorder.onstop = () => {
            const blob = new Blob(activeRecordedChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            state.interpret.recordings[state.interpret.currentIndex] = {
              url, duration: state.interpret.recSeconds, simulated: false
            };
            if (activeMediaStream) {
              activeMediaStream.getTracks().forEach(t => t.stop());
              activeMediaStream = null;
            }
            if (state.view === 'interpret') startAutoPlayback(url, false);
          };
          activeMediaRecorder.start();
        } catch (err) {
          state.interpret.micSimulated = true;
        }
      } else {
        state.interpret.micSimulated = true;
      }

      render();

      const limit = (state.mode === 'PRACTICE' && state.params.timerLimit > 0) ? state.params.timerLimit : 0;
      activeRecInterval = setInterval(() => {
        state.interpret.recSeconds += 1;
        const timerEl = document.getElementById('rec-timer-text');
        if (timerEl) {
          timerEl.textContent = limit > 0
            ? `Time left: ${Math.max(0, limit - state.interpret.recSeconds)}s`
            : `Recording: ${formatDuration(state.interpret.recSeconds)}`;
        }
        if (limit > 0 && state.interpret.recSeconds >= limit) stopRecording();
      }, 1000);
    }

    function stopRecording() {
      if (activeRecInterval) { clearInterval(activeRecInterval); activeRecInterval = null; }
      if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
        try { activeMediaRecorder.stop(); return; } catch (e) {}
      }
      state.interpret.recordings[state.interpret.currentIndex] = {
        url: null, duration: Math.max(2, state.interpret.recSeconds), simulated: true
      };
      startAutoPlayback(null, true);
    }

    // ---- [INTERPRET] STEP 4: AUTO-PLAYBACK ----
    function startAutoPlayback(audioUrl, simulated) {
      state.interpret.phase = 'PLAYBACK';
      state.interpret.playbackProgress = 0;
      render();

      if (!simulated && audioUrl) {
        try {
          activeAudioEl = new Audio(audioUrl);
          activeAudioEl.ontimeupdate = () => {
            if (!activeAudioEl || !activeAudioEl.duration || !isFinite(activeAudioEl.duration)) return;
            updatePlaybackUI(Math.min(100, (activeAudioEl.currentTime / activeAudioEl.duration) * 100));
          };
          activeAudioEl.onended = () => {
            updatePlaybackUI(100);
            setTimeout(() => {
              if (state.view === 'interpret' && state.interpret.phase === 'PLAYBACK') proceedNextSegment();
            }, 450);
          };
          activeAudioEl.onerror = () => runSimulatedPlayback();
          activeAudioEl.play().catch(() => runSimulatedPlayback());
          return;
        } catch (e) {}
      }
      runSimulatedPlayback();
    }

    function runSimulatedPlayback() {
      let pct = 0;
      activeSimPlaybackInterval = setInterval(() => {
        pct += 5;
        updatePlaybackUI(pct);
        if (pct >= 100) {
          clearInterval(activeSimPlaybackInterval);
          activeSimPlaybackInterval = null;
          setTimeout(() => {
            if (state.view === 'interpret' && state.interpret.phase === 'PLAYBACK') proceedNextSegment();
          }, 350);
        }
      }, 110);
    }

    function updatePlaybackUI(pct) {
      state.interpret.playbackProgress = pct;
      const bar = document.getElementById('playback-bar-fill');
      const lbl = document.getElementById('playback-pct-label');
      if (bar) bar.style.width = `${pct}%`;
      if (lbl) lbl.textContent = `${Math.round(pct)}%`;
    }

    function proceedNextSegment() {
      cleanupMedia();
      if (state.interpret.currentIndex < state.interpret.segments.length - 1) {
        state.interpret.currentIndex += 1;
        state.interpret.phase = 'IDLE';
        render();
      } else {
        completeExerciseAndReview();
      }
    }

    function completeExerciseAndReview() {
      const ex = getSelectedExercise();
      state.streak.streakCount += 1;
      state.streak.totalSessions += 1;
      if (ex && !state.streak.completedIds.includes(ex.id)) {
        state.streak.completedIds.push(ex.id);
      }
      saveStreak(state.streak);
      state.streakJustLit = true;
      state.reviewShowChunks = false;
      navigate('review');
    }

    /*************************************************************************
     * 10. VIEW 5: REVIEW SCREEN ([REVIEW] + STREAK CELEBRATION)
     *************************************************************************/
    function renderReviewView() {
      const ex = getSelectedExercise();
      if (!ex) return renderHomeView();

      const isChallenge = state.mode === 'CHALLENGE';
      const nextRec = state.exercises.find(e => e.id !== ex.id && !state.streak.completedIds.includes(e.id))
        || state.exercises.find(e => e.id !== ex.id)
        || ex;

      const recordedSegments = state.interpret.recordings
        .map((rec, idx) => ({ rec, idx }))
        .filter(item => item.rec && item.rec.url);

      const transcriptHtml = ex.sentences.map((s, idx) => {
        const display = state.reviewShowChunks
          ? escapeHtml(s).replace(/\s\/\s/g, ' <span class="text-[#58CC02] font-black px-0.5">/</span> ')
          : escapeHtml(stripChunks(s));
        return `<p class="mb-2.5 last:mb-0"><span class="text-xs font-extrabold text-slate-400 mr-1.5">${idx + 1}.</span>${display}</p>`;
      }).join('');

      return `
        <div class="animate-view max-w-5xl mx-auto space-y-7">
          <!-- STREAK CELEBRATION BANNER -->
          <section class="relative overflow-hidden rounded-[30px] bg-gradient-to-r from-[#58CC02] via-[#61E002] to-[#FF9600] p-6 sm:p-8 text-white shadow-xl border-b-4 border-[#46A302]">
            <div id="confetti-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div class="relative flex flex-col sm:flex-row items-center justify-between gap-5">
              <div class="flex items-center gap-4 text-center sm:text-left flex-col sm:flex-row">
                <div class="bg-white/20 backdrop-blur-md p-2 rounded-3xl">
                  ${getMascotSVG(68)}
                </div>
                <div>
                  <div class="inline-block px-3 py-0.5 rounded-full bg-white/20 text-xs font-extrabold uppercase tracking-wider mb-1">
                    Exercise Completed!
                  </div>
                  <h1 class="font-display text-2xl sm:text-3xl font-black tracking-tight">
                    Streak Lit! 🔥
                  </h1>
                  <p class="text-white/95 text-sm mt-1">
                    Awesome work! Your interpreting streak is now <strong>${state.streak.streakCount}</strong>. Keep the momentum going!
                  </p>
                </div>
              </div>
              <div class="px-5 py-3 rounded-2xl bg-white text-[#FF9600] border-b-4 border-[#D97706] font-display font-black text-2xl shadow-md shrink-0">
                +1 🔥 <span class="text-sm font-bold text-slate-500 ml-1">(${state.streak.streakCount})</span>
              </div>
            </div>
          </section>

          <!-- Review Header + Chunking Toggle -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="font-display text-xl sm:text-2xl font-black text-slate-900">Performance Review ([REVIEW])</h2>
              <p class="text-sm text-slate-500">${escapeHtml(ex.title)} • ${state.mode} Mode</p>
            </div>
            <button onclick="toggleReviewChunks()" class="self-start sm:self-auto px-4 py-2 rounded-2xl text-xs font-extrabold border-2 transition-colors ${state.reviewShowChunks ? 'bg-[#58CC02] text-white border-[#46A302]' : 'bg-white text-[#46A302] border-[#D7FFB8] hover:bg-[#EEFFDB]'}">
              ${state.reviewShowChunks ? 'Hide Chunk Separators (/)' : '✂️ Highlight Chunks (/)'}
            </button>
          </div>

          <!-- User Recordings Playback Strip (if recorded) -->
          ${recordedSegments.length > 0 ? `
            <section class="bg-white rounded-[26px] p-5 border-2 border-[#D7FFB8] shadow-card">
              <h3 class="font-display font-extrabold text-sm text-[#46A302] uppercase tracking-wider mb-3">🎙 Your Recorded Segments</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${recordedSegments.map(({ rec, idx }) => `
                  <div class="p-3 rounded-2xl bg-[#F6FDF2] border border-[#D7FFB8] flex flex-col gap-1.5">
                    <span class="text-xs font-extrabold text-slate-700">Segment ${idx + 1}</span>
                    <audio controls src="${rec.url}" class="w-full h-8"></audio>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- SIDE-BY-SIDE COMPARISON -->
          <section class="bg-white rounded-[28px] border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200">
              <!-- Original Transcript (English) -->
              <div class="p-6 sm:p-7">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-[11px] font-extrabold uppercase tracking-wider mb-4">
                  Original Transcript (English)
                </div>
                <div class="text-sm sm:text-[15px] text-slate-800 leading-relaxed">
                  ${transcriptHtml}
                </div>
              </div>

              <!-- Reference Translation (Vietnamese) -->
              <div class="p-6 sm:p-7 bg-[#F6FDF2]/80">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#EEFFDB] text-[#46A302] border border-[#D7FFB8] text-[11px] font-extrabold uppercase tracking-wider mb-4">
                  Reference Translation (Vietnamese)
                </div>
                <div class="text-sm sm:text-[15px] text-slate-800 leading-relaxed font-medium">
                  ${escapeHtml(ex.translationVi)}
                </div>
              </div>
            </div>
          </section>

          <!-- ACTION BUTTONS: FINISH & PRACTICE MORE -->
          <div class="bg-white rounded-[26px] p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
              <div class="font-display font-extrabold text-slate-900 text-base">Ready for your next session?</div>
              <div class="text-xs text-slate-500 mt-0.5">Recommended next: <strong>${escapeHtml(nextRec.title)}</strong></div>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
              <button onclick="navigate('home')" class="w-full sm:w-auto btn-3d-white px-7 py-3.5 rounded-2xl text-sm font-extrabold">
                FINISH
              </button>
              <button onclick="openExercise('${escapeHtml(nextRec.id)}')" class="w-full sm:w-auto ${isChallenge ? 'btn-3d-red' : 'btn-3d-green'} px-7 py-3.5 rounded-2xl text-sm font-extrabold">
                PRACTICE MORE →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleReviewChunks() { state.reviewShowChunks = !state.reviewShowChunks; render(); }

    function triggerReviewConfetti() {
      if (!state.streakJustLit) return;
      state.streakJustLit = false;
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#FFFFFF', '#FEF08A', '#89E219', '#BAE6FD', '#FDE047', '#FECDD3'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.top = `${Math.random() * 20}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 0.6}s`;
        layer.appendChild(piece);
      }
    }

    /*************************************************************************
     * 11. VIEW 6: ADMIN MODE (100% ENGLISH CRUD + DRIVE ID AUTO-EXTRACTION)
     *************************************************************************/
    let adminDraft = null;

    function renderAdminView() {
      if (state.adminEditingId !== null) return renderAdminForm();

      const rows = state.exercises.map(ex => {
        const tg = getTagStyle(ex.tag);
        const lv = getLevelStyle(ex.level, 'PRACTICE');
        return `
          <tr class="border-b border-slate-100 last:border-0 hover:bg-[#F6FDF2] transition-colors">
            <td class="py-4 px-4 font-extrabold text-xs text-[#46A302]">${escapeHtml(ex.id)}</td>
            <td class="py-4 px-4">
              <div class="font-extrabold text-sm text-slate-900">${escapeHtml(ex.title)}</div>
              <div class="text-xs text-slate-500 line-clamp-1 mt-0.5">${escapeHtml(ex.summary)}</div>
            </td>
            <td class="py-4 px-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-extrabold" style="background:${lv.bg}; color:${lv.text};">Level ${ex.level}</span>
            </td>
            <td class="py-4 px-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold border" style="background:${tg.bg}; color:${tg.text}; border-color:${tg.border};">${escapeHtml(ex.tag)}</span>
            </td>
            <td class="py-4 px-4 text-xs font-semibold text-slate-500">
              ${ex.driveFileId ? '<span class="text-[#46A302] font-extrabold">🎧 Drive MP3</span>' : '<span class="text-slate-400">No Audio</span>'}
            </td>
            <td class="py-4 px-4 text-xs font-semibold text-slate-500">${ex.sentences.length} sentences • ${ex.glossary.length} words</td>
            <td class="py-4 px-4 text-right whitespace-nowrap">
              <button onclick="adminStartEdit('${escapeHtml(ex.id)}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold text-[#46A302] bg-[#EEFFDB] hover:bg-[#D7FFB8] mr-1.5 transition-colors">Edit</button>
              <button onclick="adminConfirmDelete('${escapeHtml(ex.id)}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold text-rose-600 bg-rose-50 hover:bg-rose-100 transition-colors">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="animate-view space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white rounded-[28px] p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card">
            <div>
              <span class="inline-block px-2.5 py-0.5 rounded-full bg-[#EEFFDB] text-[#46A302] text-[10px] font-extrabold uppercase tracking-wider mb-1.5">Admin Mode</span>
              <h1 class="font-display text-2xl font-black text-slate-900">Exercise Content Manager</h1>
              <p class="text-sm text-slate-500 mt-0.5">Add, edit, or delete exercises, link Google Drive MP3 audio, and manage chunking & glossaries.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">
              <button onclick="adminConfirmReset()" class="btn-3d-white px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">
                Reset Default Data
              </button>
              <button onclick="adminStartEdit('NEW')" class="btn-3d-green px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold">
                + Add New Exercise
              </button>
            </div>
          </div>

          <div class="bg-white rounded-[28px] border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-[#F6FDF2] border-b border-[#D7FFB8] text-[11px] font-extrabold uppercase tracking-wider text-[#46A302]">
                    <th class="py-3.5 px-4">ID</th>
                    <th class="py-3.5 px-4">Exercise</th>
                    <th class="py-3.5 px-4">Level</th>
                    <th class="py-3.5 px-4">Topic</th>
                    <th class="py-3.5 px-4">Audio</th>
                    <th class="py-3.5 px-4">Stats</th>
                    <th class="py-3.5 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function adminStartEdit(id) {
      if (id === 'NEW') {
        adminDraft = {
          id: 'E' + (state.exercises.length + 1),
          title: '',
          driveFileId: '',
          level: 1,
          tag: 'Environment',
          mode: 'BOTH',
          summary: '',
          brief: '',
          sentences: [''],
          translationVi: '',
          glossary: [{ term: '', meaning: '', note: '' }]
        };
      } else {
        const found = state.exercises.find(e => e.id === id);
        adminDraft = found ? JSON.parse(JSON.stringify(found)) : null;
      }
      state.adminEditingId = id;
      render();
    }

    function renderAdminForm() {
      if (!adminDraft) { state.adminEditingId = null; return renderAdminView(); }
      const isNew = state.adminEditingId === 'NEW';

      return `
        <div class="animate-view max-w-4xl mx-auto space-y-6">
          <div class="flex items-center justify-between">
            <button onclick="adminCancelEdit()" class="inline-flex items-center gap-1.5 text-sm font-bold text-[#46A302] hover:text-[#58CC02]">
              ← Back to Exercise List
            </button>
            <h1 class="font-display text-xl font-black text-slate-900">${isNew ? 'Create New Exercise' : 'Edit Exercise ' + escapeHtml(adminDraft.id)}</h1>
          </div>

          <form onsubmit="adminSaveForm(event)" class="space-y-6">
            <!-- Section 1: Metadata & Drive Audio -->
            <div class="bg-white rounded-[28px] p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card space-y-4">
              <h2 class="font-display font-extrabold text-base text-slate-900 border-b border-slate-100 pb-3">1. Exercise Details & Google Drive Audio</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Exercise Title *</label>
                  <input required type="text" value="${escapeHtml(adminDraft.title)}" oninput="adminDraft.title=this.value" placeholder="e.g., Global Renewable Energy Summit" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]" />
                </div>

                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Google Drive MP3 Link or File ID (auto-extracts ID)</label>
                  <input type="text" value="${escapeHtml(adminDraft.driveFileId || '')}" oninput="adminUpdateDriveId(this.value)" placeholder="Paste https://drive.google.com/file/d/FILE_ID/view or raw FILE_ID" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]" />
                  <p id="drive-id-preview" class="text-[11px] font-bold text-[#46A302] mt-1">
                    ${adminDraft.driveFileId ? 'Extracted Drive File ID: ' + escapeHtml(adminDraft.driveFileId) : 'Paste a Google Drive share link or raw file ID for MP3 audio.'}
                  </p>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Difficulty Level</label>
                  <select onchange="adminDraft.level=Number(this.value)" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">
                    <option value="1" ${adminDraft.level == 1 ? 'selected' : ''}>Level 1 (Beginner)</option>
                    <option value="2" ${adminDraft.level == 2 ? 'selected' : ''}>Level 2 (Intermediate)</option>
                    <option value="3" ${adminDraft.level == 3 ? 'selected' : ''}>Level 3 (Advanced)</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Topic Tag</label>
                  <select onchange="adminDraft.tag=this.value" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">
                    ${AVAILABLE_TAGS.map(t => `<option value="${escapeHtml(t)}" ${adminDraft.tag === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
                  </select>
                </div>

                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Available Mode</label>
                  <select onchange="adminDraft.mode=this.value" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">
                    <option value="BOTH" ${adminDraft.mode === 'BOTH' ? 'selected' : ''}>Both (PRACTICE & CHALLENGE)</option>
                    <option value="PRACTICE" ${adminDraft.mode === 'PRACTICE' ? 'selected' : ''}>PRACTICE Only</option>
                    <option value="CHALLENGE" ${adminDraft.mode === 'CHALLENGE' ? 'selected' : ''}>CHALLENGE Only</option>
                  </select>
                </div>

                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Short Summary (English) *</label>
                  <textarea required rows="2" oninput="adminDraft.summary=this.value" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">${escapeHtml(adminDraft.summary)}</textarea>
                </div>

                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">Background Knowledge Brief (English) *</label>
                  <textarea required rows="3" oninput="adminDraft.brief=this.value" class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">${escapeHtml(adminDraft.brief)}</textarea>
                </div>
              </div>
            </div>

            <!-- Section 2: Sentences with Chunking (/) & Vietnamese Reference Translation -->
            <div class="bg-white rounded-[28px] p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card space-y-4">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div>
                  <h2 class="font-display font-extrabold text-base text-slate-900">2. Sentences & Chunking (${adminDraft.sentences.length} sentences)</h2>
                  <p class="text-xs text-slate-500">Use <code>/</code> between phrases to mark interpreting chunks.</p>
                </div>
                <button type="button" onclick="adminAddSentence()" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-[#EEFFDB] text-[#46A302] hover:bg-[#D7FFB8]">+ Add Sentence</button>
              </div>
              <div class="space-y-3">
                ${adminDraft.sentences.map((s, idx) => `
                  <div class="p-3.5 rounded-2xl bg-[#F6FDF2] border border-[#D7FFB8] space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold text-[#46A302]">Sentence ${idx + 1}</span>
                      ${adminDraft.sentences.length > 1 ? `<button type="button" onclick="adminRemoveSentence(${idx})" class="text-xs font-bold text-rose-500 hover:underline">Remove</button>` : ''}
                    </div>
                    <textarea required rows="2" placeholder="English sentence with / chunk markers..." oninput="adminDraft.sentences[${idx}]=this.value" class="w-full px-3.5 py-2 rounded-xl bg-white border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#58CC02]">${escapeHtml(s)}</textarea>
                  </div>
                `).join('')}
              </div>

              <div class="pt-3 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-600 mb-1.5">Reference Translation (Vietnamese) *</label>
                <textarea required rows="4" oninput="adminDraft.translationVi=this.value" placeholder="Enter the complete polished Vietnamese reference translation..." class="w-full px-4 py-2.5 rounded-xl bg-[#F6FDF2] border-2 border-[#E5E7EB] text-sm focus:bg-white focus:outline-none focus:border-[#58CC02]">${escapeHtml(adminDraft.translationVi)}</textarea>
              </div>
            </div>

            <!-- Section 3: Glossary -->
            <div class="bg-white rounded-[28px] p-6 border-2 border-[#E5E7EB] border-b-4 border-b-[#D1D5DB] shadow-card space-y-4">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h2 class="font-display font-extrabold text-base text-slate-900">3. Glossary Vocabulary (${adminDraft.glossary.length} words)</h2>
                <button type="button" onclick="adminAddGlossary()" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-[#EEFFDB] text-[#46A302] hover:bg-[#D7FFB8]">+ Add Word</button>
              </div>
              <div class="space-y-2.5">
                ${adminDraft.glossary.map((g, idx) => `
                  <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center p-3 rounded-2xl bg-[#F6FDF2] border border-[#D7FFB8]">
                    <input required type="text" placeholder="Term / Phrase (EN)" value="${escapeHtml(g.term)}" oninput="adminDraft.glossary[${idx}].term=this.value" class="sm:col-span-4 px-3 py-2 rounded-xl bg-white border border-[#E5E7EB] text-xs font-bold" />
                    <input required type="text" placeholder="Vietnamese Equivalent" value="${escapeHtml(g.meaning)}" oninput="adminDraft.glossary[${idx}].meaning=this.value" class="sm:col-span-4 px-3 py-2 rounded-xl bg-white border border-[#E5E7EB] text-xs" />
                    <input type="text" placeholder="Notes (EN)" value="${escapeHtml(g.note || '')}" oninput="adminDraft.glossary[${idx}].note=this.value" class="sm:col-span-3 px-3 py-2 rounded-xl bg-white border border-[#E5E7EB] text-xs" />
                    <div class="sm:col-span-1 text-right">
                      ${adminDraft.glossary.length > 1 ? `<button type="button" onclick="adminRemoveGlossary(${idx})" class="text-xs font-bold text-rose-500 hover:underline">Del</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="flex justify-end gap-3">
              <button type="button" onclick="adminCancelEdit()" class="btn-3d-white px-6 py-3 rounded-2xl text-sm font-bold">Cancel</button>
              <button type="submit" class="btn-3d-green px-8 py-3 rounded-2xl text-sm font-extrabold">Save Exercise</button>
            </div>
          </form>
        </div>
      `;
    }

    function adminUpdateDriveId(rawVal) {
      const id = extractDriveId(rawVal);
      adminDraft.driveFileId = id;
      const preview = document.getElementById('drive-id-preview');
      if (preview) {
        preview.textContent = id
          ? `Extracted Drive File ID: ${id}`
          : 'Paste a Google Drive share link or raw file ID for MP3 audio.';
      }
    }

    function adminCancelEdit() { state.adminEditingId = null; adminDraft = null; render(); }
    function adminAddSentence() { adminDraft.sentences.push(''); render(); }
    function adminRemoveSentence(idx) { adminDraft.sentences.splice(idx, 1); render(); }
    function adminAddGlossary() { adminDraft.glossary.push({ term: '', meaning: '', note: '' }); render(); }
    function adminRemoveGlossary(idx) { adminDraft.glossary.splice(idx, 1); render(); }

    function adminSaveForm(e) {
      e.preventDefault();
      if (!adminDraft) return;
      if (state.adminEditingId === 'NEW') {
        state.exercises.unshift(adminDraft);
        showToast('New exercise created successfully!', 'success');
      } else {
        const idx = state.exercises.findIndex(x => x.id === state.adminEditingId);
        if (idx !== -1) state.exercises[idx] = adminDraft;
        showToast('Exercise updated successfully!', 'success');
      }
      saveExercises(state.exercises);
      state.adminEditingId = null;
      adminDraft = null;
      render();
    }

    function adminConfirmDelete(id) {
      const ex = state.exercises.find(x => x.id === id);
      if (!ex) return;
      openModal({
        title: 'Delete Exercise?',
        body: `Are you sure you want to permanently delete <strong>${escapeHtml(ex.title)}</strong>?`,
        actions: [
          { label: 'Cancel', className: 'btn-3d-white px-4 py-2 rounded-2xl text-sm font-bold' },
          {
            label: 'Delete',
            className: 'btn-3d-red px-4 py-2 rounded-2xl text-sm font-extrabold',
            onClick: () => {
              state.exercises = state.exercises.filter(x => x.id !== id);
              saveExercises(state.exercises);
              showToast('Exercise deleted.', 'info');
              render();
            }
          }
        ]
      });
    }

    function adminConfirmReset() {
      openModal({
        title: 'Reset Default 13 Exercises?',
        body: 'This will restore all 13 default exercises linked to their Google Drive MP3 audio files. Your Streak progress will be preserved.',
        actions: [
          { label: 'Cancel', className: 'btn-3d-white px-4 py-2 rounded-2xl text-sm font-bold' },
          {
            label: 'Reset Data',
            className: 'btn-3d-green px-4 py-2 rounded-2xl text-sm font-extrabold',
            onClick: () => {
              state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
              saveExercises(state.exercises);
              showToast('Restored all 13 default exercises!', 'success');
              render();
            }
          }
        ]
      });
    }

    /*************************************************************************
     * 12. BOOTSTRAP APPLICATION
     *************************************************************************/
    window.addEventListener('beforeunload', cleanupMedia);
    window.addEventListener('DOMContentLoaded', () => {
      render();
      initSplash();
    });
  </script>
</body>
</html>
